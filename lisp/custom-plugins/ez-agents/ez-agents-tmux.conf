# tmux configuration for ez-agents (used with its own socket, `tmux -L ez-agents').
# The multiplexer must be invisible: Emacs/Ghostel is the real terminal.
set -g prefix None
unbind-key -a -T prefix
set -g status off
set -g mouse off
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -s extended-keys on
set -ga terminal-features ",*:RGB:hyperlinks:clipboard:extkeys"
set -g remain-on-exit off
set -g destroy-unattached off
