name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version: ['29.4', '30.1', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: Install dependencies
        run: |
          emacs -Q --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\"))" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(mapc #'package-install '(transient magit-section package-lint))"
      - name: Compile
        run: make compile LOADPATH="$(for d in ~/.emacs.d/elpa/*/; do printf -- '-L %s ' "$d"; done)"
      - name: Test
        run: make test LOADPATH="$(for d in ~/.emacs.d/elpa/*/; do printf -- '-L %s ' "$d"; done)"
      - name: Lint
        run: make lint LOADPATH="$(for d in ~/.emacs.d/elpa/*/; do printf -- '-L %s ' "$d"; done)"
